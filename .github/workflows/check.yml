name: Bilet kontrolu

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Workflow token'ini salt-okunur yap: repo public oldugu icin
# GITHUB_TOKEN'in yazma yetkisi olmasina gerek yok.
permissions:
  contents: read

concurrency:
  group: bilet-kontrolu
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Bagimliliklar
        run: npm ci

      # Chromium'u her calismada yeniden indirmemek icin cache'le (~130MB)
      - name: Playwright cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Chromium kur
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Chromium sistem bagimliliklari
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Onceki calismadan kalan state.json'i geri yukle ki ayni bilet
      # her 20 dakikada bir tekrar bildirilmesin.
      - name: State geri yukle
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: flight-state-${{ github.run_id }}
          restore-keys: flight-state-

      # Aranan rotalar/tarihler/esik repoda tutulmuyor; secret'tan geliyor.
      - name: Config olustur
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -n "$CONFIG_JSON" ]; then
            printf '%s' "$CONFIG_JSON" > config.json
            echo "config.json CONFIG_JSON secret'indan yazildi"
          else
            echo "HATA: CONFIG_JSON secret'i tanimli degil." >&2
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('config.json','utf8')); console.log('config.json gecerli JSON')"

      - name: Kontrol et
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node bot.js --once

      # Cache anahtarlari degistirilemez, o yuzden her calisma kendi
      # run_id'siyle yaziyor; restore-keys prefix'i en sonuncuyu buluyor.
      - name: State kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: flight-state-${{ github.run_id }}
